<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get a Quote | Shipfront</title>
  <meta name="description" content="Request a Shipfront quote. Name, email, and company.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <noscript><style>[data-reveal],.clip > span{opacity:1;transform:none}</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" data-nav>
    <div class="wrap">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="../" aria-label="Shipfront home">
          <svg class="mark" viewBox="0 0 80 80" aria-hidden="true">
            <polygon points="40,14 62,27 40,40 18,27" fill="#000000"/>
            <polygon points="18,27 40,40 40,66 18,53" fill="#000000"/>
            <polygon points="62,27 40,40 40,66 62,53" fill="#000000"/>
            <g fill="none" stroke="#000000" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter">
              <polyline points="40,14 62,27 40,40 18,27 40,14"/>
              <polyline points="18,27 18,53 40,66 62,53 62,27"/>
              <line x1="40" y1="40" x2="40" y2="66"/>
              <line x1="40" y1="40" x2="18" y2="27"/>
              <line x1="40" y1="40" x2="62" y2="27"/>
            </g>
          </svg>
          <span class="wordmark-bar"><span class="wordmark">SHIPFRONT</span></span>
        </a>

        <ul class="nav-links">
          <li><a href="../#why">Why Shipfront</a></li>
          <li><a href="../contact/">Contact</a></li>
          <li><a class="cta" href="../quote/" aria-current="page">Get a Quote</a></li>
        </ul>

        <button class="nav-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="nav-menu">
          <span class="bars" aria-hidden="true"></span>
          <span>Menu</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <section class="page">
        <p class="kicker" data-reveal>Quote</p>
        <h1 class="clip" data-clip style="--i:1"><span>Get a Quote</span></h1>
        <p class="page-lead" data-reveal style="--i:2">Please take a moment to give us some information. We have expert agents standing by to take care of your logistics needs.</p>

        <form class="form" data-sheet-form novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" autocomplete="organization" required>
          </div>
          <button class="cta--ink" type="submit">Submit request</button>
        </form>

        <div id="form-status" class="form-status" data-form-status role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span class="byline">Built by David T Phung</span>
    </div>
  </footer>

  <div class="sheet sheet--menu" id="nav-menu" data-sheet="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <button class="sheet-scrim" type="button" tabindex="-1" aria-hidden="true" data-sheet-dismiss></button>
    <div class="sheet-panel" data-sheet-panel tabindex="-1">
      <div class="sheet-grab" data-sheet-grab aria-hidden="true"></div>
      <div class="sheet-head">
        <h2>Menu</h2>
        <button class="sheet-close" type="button" data-sheet-dismiss>Close</button>
      </div>
      <ul class="nav-links">
        <li><a href="../#why">Why Shipfront</a></li>
        <li><a href="../contact/">Contact</a></li>
        <li><a class="cta" href="../quote/" aria-current="page">Get a Quote</a></li>
      </ul>
    </div>
  </div>

  <script src="../script.js"></script>
</body>
</html>
